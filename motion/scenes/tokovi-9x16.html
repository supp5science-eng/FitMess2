<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8" />
<title>FitMess motion — portal 9:16</title>
<style>
  /* Scena se crta u 540x960 CSS px i snima na 2x (1080x1920) @ 60fps.
     Nista se ne animira preko CSS/Web animacija -- svaki frejm je cista
     funkcija vremena (window.render(t)), da bi render bio deterministican i
     da bi motion blur mogao da se dobije temporalnim uzorkovanjem. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 540px; height: 960px; overflow: hidden; background: #fff; }
  body {
    font-family: Inter, system-ui, sans-serif;
    color: #0a0c0b;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  #stage { position: relative; width: 540px; height: 960px; background: #fff; }
  #art { position: absolute; left: 0; top: 0; width: 540px; height: 960px; }
</style>
</head>
<body>
<div id="stage">
  <svg id="art" viewBox="0 0 540 960" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="portalGlow">
        <stop offset="0%" stop-color="#17d1a8" stop-opacity="0.5" />
        <stop offset="55%" stop-color="#17d1a8" stop-opacity="0.14" />
        <stop offset="100%" stop-color="#17d1a8" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#17d1a8" stop-opacity="0.34" />
        <stop offset="100%" stop-color="#17d1a8" stop-opacity="0.04" />
      </linearGradient>
      <radialGradient id="phoneGlow">
        <stop offset="0%" stop-color="#17d1a8" stop-opacity="0.45" />
        <stop offset="100%" stop-color="#17d1a8" stop-opacity="0" />
      </radialGradient>
      <!-- prsten kalorija: azure gradijent iz app-a (--gauge-grad-1/2/3, light) -->
      <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#4cc3f7" />
        <stop offset="55%" stop-color="#0ea5e9" />
        <stop offset="100%" stop-color="#0a6fae" />
      </linearGradient>
    </defs>

    <!-- natpisi iznad vrtloga -->
    <text id="labL" x="126" y="96" text-anchor="middle" font-family="Inter"
          font-size="18" font-weight="800" letter-spacing="2.4">1000+ STUDIJA</text>
    <text id="labR" x="414" y="96" text-anchor="middle" font-family="Inter"
          font-size="18" font-weight="800" letter-spacing="2.4">TVOJI PODACI</text>

    <!-- vrtlozi (ikonice se dodaju iz JS-a) -->
    <g id="orbitL"></g>
    <g id="orbitR"></g>

    <!-- zeleni snop portal -> telefon -->
    <path id="beam" d="" fill="url(#beamGrad)" opacity="0" />
    <g id="merged"></g>

    <!-- PORTAL -->
    <ellipse id="portalHalo" cx="270" cy="400" rx="200" ry="86" fill="url(#portalGlow)" opacity="0" />
    <g id="portal">
      <ellipse id="ring1" cx="270" cy="400" rx="134" ry="39" stroke="#c9ced2" stroke-width="2.4" />
      <ellipse id="ring2" cx="270" cy="400" rx="103" ry="30" stroke="#d8dcdf" stroke-width="2" />
      <ellipse id="ring3" cx="270" cy="400" rx="70" ry="20" stroke="#e4e7e9" stroke-width="1.8" />
    </g>

    <!-- TELEFON: prazna kontura dok ne stigne zeleni tok, pa se upali app UI -->
    <circle id="phoneGlowC" cx="270" cy="712" r="200" fill="url(#phoneGlow)" opacity="0" />
    <g id="phone">
      <rect id="phoneBody" x="164" y="518" width="212" height="392" rx="31"
            stroke="#c9ced2" stroke-width="2.6" fill="#fff" />
      <rect id="screen" x="175" y="530" width="190" height="368" rx="22"
            stroke="#e6e9eb" stroke-width="1.6" fill="#fff" />
      <rect x="252" y="539" width="36" height="4.5" rx="2.2" fill="#dfe3e6" />

      <!-- ================= APP UI (ekran /danas) ================= -->
      <g id="ui" opacity="0">
        <!-- statusna traka -->
        <g class="uiPart" data-step="0">
          <text x="189" y="556" font-family="Inter" font-size="9" font-weight="800" fill="#0a0c0b">9:41</text>
          <g fill="#0a0c0b">
            <rect x="330" y="550" width="2.5" height="4" rx="1" /><rect x="334.5" y="548" width="2.5" height="6" rx="1" />
            <rect x="339" y="546" width="2.5" height="8" rx="1" />
            <rect x="345" y="547.5" width="11" height="6.5" rx="2" opacity="0.35" />
            <rect x="346.5" y="549" width="8" height="3.5" rx="1.2" />
          </g>
        </g>

        <!-- zaglavlje -->
        <g class="uiPart" data-step="1">
          <text x="189" y="580" font-family="Inter" font-size="15" font-weight="900"
                letter-spacing="-0.4" fill="#0a0c0b">Danas</text>
          <text x="351" y="579" text-anchor="end" font-family="Inter" font-size="8.5"
                font-weight="700" fill="#8a9095">sre, 5. avg</text>
        </g>

        <!-- traka datuma -->
        <g class="uiPart" data-step="2" id="dateStrip"></g>

        <!-- kalorijski prsten -->
        <g class="uiPart" data-step="3">
          <circle cx="270" cy="700" r="52" fill="none" stroke="#e2f2fb" stroke-width="12" />
          <circle id="ringArc" cx="270" cy="700" r="52" fill="none" stroke="url(#gaugeGrad)"
                  stroke-width="12" stroke-linecap="round" transform="rotate(-90 270 700)"
                  stroke-dasharray="326.7" stroke-dashoffset="326.7" />
          <text id="uiNum" x="270" y="697" text-anchor="middle" dominant-baseline="central"
                font-family="Inter" font-size="27" font-weight="900" letter-spacing="-1.1"
                fill="#0a0c0b">0</text>
          <text x="270" y="718" text-anchor="middle" dominant-baseline="central"
                font-family="Inter" font-size="9" font-weight="800" letter-spacing="0.5"
                fill="#8a9095">kcal / dan</text>
        </g>

        <!-- makroi -->
        <g class="uiPart" data-step="4" id="macros"></g>

        <!-- donja navigacija -->
        <g class="uiPart" data-step="5">
          <line x1="181" y1="862" x2="359" y2="862" stroke="#eceef0" stroke-width="1.2" />
          <g id="nav"></g>
        </g>
      </g>
    </g>
  </svg>
</div>

<script>
(() => {
  /* ============================================================
     PODESIVO -- sve sto se najcesce menja stoji ovde
     ============================================================ */
  const CFG = {
    duration: 6.0,
    fps: 60,
    mblur: 4,                    // pod-frejmova po frejmu (pravi motion blur)

    resultNumber: '2.154',
    resultUnit: 'kcal / dan',
    labelLeft: '1000+ STUDIJA',
    labelRight: 'TVOJI PODACI',

    blue: '#2563eb',             // levi vrtlog: naucne studije
    violet: '#7c3aed',           // desni vrtlog: tvoji podaci (app "Koraci" akcent)
    green: '#12b48f',            // spoj: linije
    brand: '#17d1a8',            // spoj: glow / snop (--brand iz globals.css)

    ink: '#0a0c0b',
    muted: '#646b6f',

    stroke: 1.5,                 // 3px na 1080 (scena se snima na 2x)
    iconSize: 1.18,
    orbitTurns: 1.35,            // koliko krugova naprave pre nego sto krenu dole
  };

  /* ---------- easing ---------- */
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const p = (t, a, b) => clamp01((t - a) / (b - a));
  const outCubic = (x) => 1 - Math.pow(1 - x, 3);
  const inQuad = (x) => x * x;
  const spring = (x, f = 8.5, d = 5.5) => (x >= 1 ? 1 : 1 - Math.exp(-d * x) * Math.cos(f * x));
  const mix = (a, b, x) => a + (b - a) * x;
  const el = (id) => document.getElementById(id);
  const SVG = 'http://www.w3.org/2000/svg';

  const PORTAL = { x: 270, y: 400 };
  const PHONE = { x: 270, y: 712, top: 518 };

  /* ============================================================
     IKONICE -- kutija ~40x40 oko koordinatnog pocetka
     ============================================================ */
  const ICONS = {
    paper: '<rect x="-14" y="-18" width="28" height="36" rx="3"/>' +
           '<path d="M-7 -10H7M-7 -3H7M-7 4H7M-7 11H2"/>',
    bars:  '<path d="M-15 15H15"/><rect x="-11" y="-2" width="7" height="13"/>' +
           '<rect x="-1.5" y="-11" width="7" height="22"/><rect x="8" y="-6" width="7" height="17"/>',
    line:  '<path d="M-15 -15V15H15"/><path d="M-10 8L-3 -2L4 4L11 -9"/><circle cx="11" cy="-9" r="2.4"/>',
    mol:   '<circle cx="0" cy="-11" r="4.2"/><circle cx="-11" cy="7" r="4.2"/>' +
           '<circle cx="11" cy="7" r="4.2"/><path d="M-2.3 -7.5L-9 3.5M2.3 -7.5L9 3.5M-6.8 7H6.8"/>',
    flask: '<path d="M-5.5 -17V-6L-14 11a3.6 3.6 0 003.2 5.5h21.6A3.6 3.6 0 0014 11L5.5 -6V-17"/>' +
           '<path d="M-8.5 -17H8.5"/><path d="M-10.5 3.5h21"/>',
    check: '<circle cx="0" cy="0" r="15"/><path d="M-6.5 0.5L-1.5 5.5L7.5 -5"/>',

    person:'<circle cx="0" cy="-10" r="5.6"/><path d="M-10 17v-5.5a10 10 0 0120 0V17"/>',
    scale: '<rect x="-16" y="-14" width="32" height="28" rx="6"/>' +
           '<path d="M-7.5 -5.5a7.5 7.5 0 0115 0"/><path d="M0 -5.5l4.6-3.6"/><path d="M-8.5 8.5H8.5"/>',
    cal:   '<rect x="-15" y="-13" width="30" height="28" rx="4"/><path d="M-15 -4.5H15"/>' +
           '<path d="M-7.5 -13v-5.5M7.5 -13v-5.5"/><circle cx="-6.5" cy="4" r="1.7"/>' +
           '<circle cx="0" cy="4" r="1.7"/><circle cx="6.5" cy="4" r="1.7"/>',
    ruler: '<rect x="-18" y="-7.5" width="36" height="15" rx="3"/>' +
           '<path d="M-10.5 -7.5v5.5M-3 -7.5v8.5M4.5 -7.5v5.5M12 -7.5v8.5"/>',
    shoe:  '<path d="M-17 7.5h27a5.6 5.6 0 005.6-5.6c0-3.7-4.7-4.7-8.4-6.5l-8.4-4.7-3.7 3.7-4.7-1.9v15z"/>' +
           '<path d="M-17 7.5v-7.5h4.7"/><path d="M-2 -5.6l2.8 3.7M3.7 -2.8l2.8 3.7"/>',
    heart: '<path d="M0 14C-12 4.7-16 -2.8-10.3 -8.4c3.7-3.7 8.4-1.9 10.3 1.9 1.9-3.7 6.5-5.6 10.3-1.9 5.6 5.6 1.9 13.1-10.3 22.4z"/>' +
           '<path d="M-12 -1.9h5.6l1.9-3.7 2.8 7.5 1.9-3.7h5.6"/>',
  };

  /* ============================================================
     VRTLOZI -- ikonice kruze po elipsi (isti nagib kao portal),
     pa jedna po jedna skrenu i ponire u portal
     ============================================================ */
  const ORBIT = { rx: 79, ry: 33 };
  const SIDES = {
    L: { cx: 126, cy: 214, color: CFG.blue,   host: 'orbitL',
         icons: ['paper', 'bars', 'mol', 'line', 'flask', 'check'] },
    R: { cx: 414, cy: 214, color: CFG.violet, host: 'orbitR',
         icons: ['person', 'scale', 'cal', 'ruler', 'shoe', 'heart'] },
  };

  const T = {
    labels:  [0.05, 0.42],
    orbitIn: 0.10,               // ikonice se pojavljuju u vrtlogu
    orbitEnd: 1.22,              // do kad se samo vrte
    diveStep: 0.055,             // razmak izmedju poniranja
    diveTime: 0.62,              // koliko traje pad u portal
    portalIn: [0.45, 0.95],
    beam:    [1.80, 2.20],
    mergeT0: 1.86, mergeStep: 0.105, mergeTravel: 0.52, mergeCount: 13,
    receive: 3.44,               // telefon prima tok
    ui: 3.52,                    // app UI se pali
    ring: [3.78, 4.55],          // prsten + broj
  };

  const items = [];
  Object.entries(SIDES).forEach(([side, S]) => {
    const host = el(S.host);
    S.icons.forEach((key, i) => {
      const g = document.createElementNS(SVG, 'g');
      g.setAttribute('stroke', S.color);
      g.setAttribute('stroke-width', String(CFG.stroke / CFG.iconSize));
      g.setAttribute('stroke-linecap', 'round');
      g.setAttribute('stroke-linejoin', 'round');
      g.setAttribute('fill', 'none');
      g.innerHTML = ICONS[key];
      host.appendChild(g);
      // leva i desna strana ponire naizmenicno -> portal prima iz oba toka
      const order = i * 2 + (side === 'L' ? 0 : 1);
      items.push({
        g, side, cx: S.cx, cy: S.cy,
        phase: (i / S.icons.length) * Math.PI * 2,
        dir: side === 'L' ? 1 : -1,
        appear: T.orbitIn + i * 0.05,
        dive: T.orbitEnd + order * T.diveStep,
      });
    });
  });
  const LAST_ARRIVE = Math.max(...items.map((it) => it.dive + T.diveTime));

  // pozicija u vrtlogu u trenutku t
  const orbitPos = (it, t) => {
    const a = it.phase + it.dir * (t - T.orbitIn) * (CFG.orbitTurns * 2 * Math.PI / (T.orbitEnd - T.orbitIn));
    return [it.cx + ORBIT.rx * Math.cos(a), it.cy + ORBIT.ry * Math.sin(a), Math.sin(a)];
  };

  /* ---------- zeleni spoj: portal -> telefon ---------- */
  const merged = [];
  const mHost = el('merged');
  for (let i = 0; i < T.mergeCount; i++) {
    const g = document.createElementNS(SVG, 'g');
    g.setAttribute('fill', CFG.green);
    g.innerHTML = '<rect x="-3.2" y="-11" width="6.4" height="22" rx="3.2"/>';
    mHost.appendChild(g);
    merged.push({ g, start: T.mergeT0 + i * T.mergeStep, off: (i % 3 - 1) * 9 });
  }

  /* ============================================================
     APP UI u telefonu -- vokabular i boje su iz app-a:
     "Danas" ekran, kalorijski prsten (azure --gauge-grad-*), makroi
     (Proteini / UH / Masti) i donja navigacija (Početna / Analitika / Profil)
     ============================================================ */
  const svgEl = (tag, attrs, text) => {
    const n = document.createElementNS(SVG, tag);
    Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, String(v)));
    if (text !== undefined) n.textContent = text;
    return n;
  };

  // traka datuma: 7 dana, danas je istaknut
  (() => {
    const host = el('dateStrip');
    const days = ['P', 'U', 'S', 'Č', 'P', 'S', 'N'];
    const nums = ['31', '1', '2', '3', '4', '5', '6'];
    const w = 22, gap = 5, x0 = 181;
    days.forEach((d, i) => {
      const x = x0 + i * (w + gap);
      const active = i === 5;
      host.appendChild(svgEl('rect', {
        x, y: 592, width: w, height: 34, rx: 10,
        fill: active ? '#0a0c0b' : '#f4f5f5',
      }));
      host.appendChild(svgEl('text', {
        x: x + w / 2, y: 603, 'text-anchor': 'middle', 'font-family': 'Inter',
        'font-size': 7, 'font-weight': 800, fill: active ? '#ffffff' : '#8a9095',
      }, d));
      host.appendChild(svgEl('text', {
        x: x + w / 2, y: 617, 'text-anchor': 'middle', 'font-family': 'Inter',
        'font-size': 9.5, 'font-weight': 900, fill: active ? '#ffffff' : '#0a0c0b',
      }, nums[i]));
    });
  })();

  // makroi: ciljne kolicine za 2.154 kcal (160g P + 220g UH + 70g M = 2.150)
  (() => {
    const host = el('macros');
    const M = [
      { label: 'Proteini', val: '160 g', color: '#1f9e69', x: 212 },
      { label: 'UH', val: '220 g', color: '#c98a1b', x: 270 },
      { label: 'Masti', val: '70 g', color: '#d95540', x: 328 },
    ];
    M.forEach((m) => {
      host.appendChild(svgEl('rect', { x: m.x - 24, y: 778, width: 48, height: 6, rx: 3, fill: '#f1f2f3' }));
      host.appendChild(svgEl('rect', { x: m.x - 24, y: 778, width: 48, height: 6, rx: 3, fill: m.color }));
      host.appendChild(svgEl('text', {
        x: m.x, y: 800, 'text-anchor': 'middle', 'font-family': 'Inter',
        'font-size': 10, 'font-weight': 900, fill: '#0a0c0b',
      }, m.val));
      host.appendChild(svgEl('text', {
        x: m.x, y: 813, 'text-anchor': 'middle', 'font-family': 'Inter',
        'font-size': 7.5, 'font-weight': 700, fill: '#8a9095',
      }, m.label));
    });
  })();

  // donja navigacija
  (() => {
    const host = el('nav');
    const N = [
      { label: 'Početna', x: 212, active: true,
        icon: '<path d="M-6 0.5L0 -5L6 0.5V6a1 1 0 01-1 1H-5a1 1 0 01-1-1z"/>' },
      { label: 'Analitika', x: 270, active: false,
        icon: '<path d="M-6 6V-1M0 6V-6M6 6V2"/>' },
      { label: 'Profil', x: 328, active: false,
        icon: '<circle cx="0" cy="-2.5" r="3"/><path d="M-5 7v-1.5a5 5 0 0110 0V7"/>' },
    ];
    N.forEach((n) => {
      const g = svgEl('g', {
        transform: `translate(${n.x} 878)`,
        stroke: n.active ? '#0a0c0b' : '#b0b5b9',
        'stroke-width': 1.7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', fill: 'none',
      });
      g.innerHTML = n.icon;
      host.appendChild(g);
      host.appendChild(svgEl('text', {
        x: n.x, y: 895, 'text-anchor': 'middle', 'font-family': 'Inter',
        'font-size': 7, 'font-weight': 800, fill: n.active ? '#0a0c0b' : '#b0b5b9',
      }, n.label));
    });
  })();

  const uiParts = [...document.querySelectorAll('#ui .uiPart')];
  const RING_LEN = 2 * Math.PI * 52;
  const fmtNum = (n) => Math.round(n).toLocaleString('sr-RS').replace(/ /g, '.');
  const TARGET = Number(CFG.resultNumber.replace(/\D/g, ''));

  el('labL').textContent = CFG.labelLeft;
  el('labR').textContent = CFG.labelRight;
  el('labL').setAttribute('fill', CFG.blue);
  el('labR').setAttribute('fill', CFG.violet);
  el('beam').setAttribute('d',
    `M${PORTAL.x - 30} ${PORTAL.y} L${PORTAL.x + 30} ${PORTAL.y} ` +
    `L${PORTAL.x + 22} ${PHONE.top + 26} L${PORTAL.x - 22} ${PHONE.top + 26} Z`);

  function render(t) {
    /* ---------- natpisi ---------- */
    const labK = outCubic(p(t, T.labels[0], T.labels[1]));
    const labOut = 1 - outCubic(p(t, 2.55, 3.05));
    [['labL', 126], ['labR', 414]].forEach(([id, cx]) => {
      el(id).setAttribute('opacity', (labK * labOut).toFixed(3));
      el(id).setAttribute('transform', `translate(0 ${mix(-8, 0, labK).toFixed(1)})`);
    });

    /* ---------- portal ---------- */
    const pIn = outCubic(p(t, T.portalIn[0], T.portalIn[1]));
    // svaki dolazak ikonice napravi talas na prstenovima
    let ripple = 0, feed = 0;
    items.forEach((it) => {
      const dt = t - (it.dive + T.diveTime);
      if (dt > 0) { ripple += Math.exp(-7 * dt); feed += Math.exp(-2.2 * dt); }
    });
    ripple = Math.min(ripple, 1.6);
    // portal pozeleni dok guta podatke i takav ostaje -- app je "napunjen"
    const tint = Math.max(Math.min(feed * 0.5, 1), 0.75 * p(t, 2.0, 2.7));
    el('portal').setAttribute('opacity', pIn.toFixed(3));
    [['ring1', 134, 39, '#c9ced2'], ['ring2', 103, 30, '#d8dcdf'], ['ring3', 70, 20, '#e4e7e9']]
      .forEach(([id, rx, ry, base], i) => {
        const s = 1 + 0.045 * ripple * Math.exp(-i * 0.35) + (1 - pIn) * -0.12;
        el(id).setAttribute('rx', (rx * s).toFixed(2));
        el(id).setAttribute('ry', (ry * s).toFixed(2));
        el(id).setAttribute('stroke', tint > 0.05 ? CFG.green : base);
        el(id).setAttribute('opacity', (0.35 + 0.65 * Math.min(tint + 0.25, 1)).toFixed(3));
      });
    el('portalHalo').setAttribute('opacity',
      (Math.max(Math.min(feed * 0.42, 0.95), 0.3 * p(t, 2.0, 2.7)) * pIn).toFixed(3));
    el('portalHalo').style.transformOrigin = `${PORTAL.x}px ${PORTAL.y}px`;
    el('portalHalo').style.transform = `scale(${(0.85 + 0.2 * Math.min(feed, 1)).toFixed(3)})`;

    /* ---------- ikonice: vrte se, pa poniru u portal ---------- */
    items.forEach((it) => {
      const appear = outCubic(p(t, it.appear, it.appear + 0.3));
      if (t < it.dive) {
        const [x, y, depth] = orbitPos(it, t);
        const s = (0.84 + 0.22 * (depth + 1) / 2) * CFG.iconSize * mix(0.6, 1, appear);
        it.g.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${s.toFixed(3)})`);
        it.g.setAttribute('opacity', (appear * (0.55 + 0.45 * (depth + 1) / 2)).toFixed(3));
        return;
      }
      // poniranje: od mesta na orbiti, u luku i sa ubrzanjem, do centra portala
      const k = p(t, it.dive, it.dive + T.diveTime);
      if (k >= 1) { it.g.setAttribute('opacity', '0'); return; }
      const [sx, sy] = orbitPos(it, it.dive);
      const u = inQuad(k);
      const c1x = mix(sx, PORTAL.x, 0.25), c1y = sy + 96;
      const m = 1 - u;
      const x = m * m * sx + 2 * m * u * c1x + u * u * PORTAL.x;
      const y = m * m * sy + 2 * m * u * c1y + u * u * PORTAL.y;
      const s = mix(1, 0.22, Math.pow(u, 1.5)) * CFG.iconSize;
      it.g.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${s.toFixed(3)})`);
      it.g.setAttribute('opacity', (1 - clamp01((k - 0.72) / 0.28)).toFixed(3));
    });

    /* ---------- zeleni spoj: jedan tok iz portala u telefon ---------- */
    el('beam').setAttribute('opacity',
      (outCubic(p(t, T.beam[0], T.beam[1])) * (1 - outCubic(p(t, 3.6, 4.1)))).toFixed(3));
    merged.forEach((m2) => {
      const k = p(t, m2.start, m2.start + T.mergeTravel);
      if (k <= 0 || k >= 1) { m2.g.setAttribute('opacity', '0'); return; }
      const u = inQuad(k);
      const y = mix(PORTAL.y + 6, PHONE.top + 34, u);
      const x = mix(PORTAL.x + m2.off, PORTAL.x, Math.pow(u, 0.7));
      m2.g.setAttribute('transform',
        `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${mix(0.7, 1.25, u).toFixed(3)} ${mix(0.8, 1.7, u).toFixed(3)})`);
      m2.g.setAttribute('opacity', (outCubic(clamp01(k / 0.12)) * (1 - clamp01((k - 0.74) / 0.26))).toFixed(3));
    });

    /* ---------- telefon prima tok ---------- */
    const hit = t > T.receive ? (1 - spring(p(t, T.receive, T.receive + 0.6))) * 0.05 : 0;
    const grow = mix(1, 1.06, outCubic(p(t, T.receive, T.receive + 0.7)));
    // kad portal odradi svoje, telefon otplovi u centar kadra i preuzme scenu
    const rise = mix(0, -132, outCubic(p(t, T.receive + 0.26, T.receive + 1.1)));
    el('phone').style.transformOrigin = `${PHONE.x}px ${PHONE.y}px`;
    el('phone').style.transform = `translateY(${rise.toFixed(1)}px) scale(${(grow + hit).toFixed(4)})`;
    el('phoneGlowC').setAttribute('cy', (712 + rise).toFixed(1));
    el('phoneBody').setAttribute('stroke', t > T.receive ? '#8a9095' : '#c9ced2');
    const gk = p(t, T.receive, T.receive + 0.9);
    el('phoneGlowC').setAttribute('opacity', (gk > 0 ? Math.sin(Math.PI * gk) * 0.8 : 0).toFixed(3));
    el('phoneGlowC').style.transformOrigin = `${PHONE.x}px ${PHONE.y}px`;
    el('phoneGlowC').style.transform = `scale(${mix(0.7, 1.12, outCubic(gk)).toFixed(3)})`;

    /* ---------- app UI se pali deo po deo ---------- */
    el('ui').setAttribute('opacity', outCubic(p(t, T.ui, T.ui + 0.18)).toFixed(3));
    uiParts.forEach((g, i) => {
      const a = T.ui + i * 0.075;
      const k = outCubic(p(t, a, a + 0.3));
      g.setAttribute('opacity', k.toFixed(3));
      g.setAttribute('transform', `translate(0 ${mix(7, 0, k).toFixed(2)})`);
    });

    // prsten se ispisuje pa broj otkuca do cilja
    const ringK = outCubic(p(t, T.ring[0], T.ring[1]));
    el('ringArc').setAttribute('stroke-dashoffset', (RING_LEN * (1 - ringK)).toFixed(2));
    // brojac se kvantuje na IZLAZNE frejmove: da motion blur ne razmaze cifre
    // (pod-frejmovi unutar istog frejma moraju da pokazu isti broj)
    const tq = Math.floor(t * CFG.fps + 1e-6) / CFG.fps;
    el('uiNum').textContent = fmtNum(TARGET * outCubic(p(tq, T.ring[0] + 0.05, T.ring[1] + 0.1)));

    /* ---------- portal se povlaci kad app preuzme kadar ---------- */
    const handoff = 1 - outCubic(p(t, T.receive + 0.1, T.receive + 0.7));
    el('portal').setAttribute('opacity', (pIn * handoff).toFixed(3));
    el('portalHalo').setAttribute('opacity',
      (Number(el('portalHalo').getAttribute('opacity')) * handoff).toFixed(3));
  }

  window.SCENE = { width: 540, height: 960, fps: CFG.fps, duration: CFG.duration, mblur: CFG.mblur };
  window.render = render;
  render(0);
})();
</script>
</body>
</html>
