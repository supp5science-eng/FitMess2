<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FitMess</title>
    <!--
      Shown by the service worker (`public/sw.js`) when a full-page navigation
      cannot reach the network.

      Before this page existed, that fallback served the cached MARKETING
      LANDING -- so losing signal inside the installed app answered a tap on
      "Danas" with a sales page inviting you to install FitMess. You already had.

      Rules this file lives by:
      - ZERO network. No fonts, no CSS file, no images, no JS bundle. It is
        precached and must render from that copy alone, so the brand tokens
        below are COPIED from globals.css rather than imported.
      - No link out of the app. Anything that navigates would need the network
        to come back, and a web view has no back button (docs/izlazak-u-store.md).
        The only control is "try again", which re-requests the page the user
        actually wanted -- the service worker keeps the URL, so a reload lands
        where they were headed, not on some safe default.

      Its twin is `capacitor/www/index.html`, which the native shell shows when
      even this page cannot be reached (a cold start with no network, where no
      service worker is running yet). The two say the same thing on purpose, and
      a test holds them to it.
    -->
    <style>
      :root {
        --ground: #ffffff;
        --fg: #0a0c0b;
        --muted: #5c6663;
        --primary: #17d1a8;
        --on-primary: #04231c;
        /* The sedef (paua-shell) gradient "Mess" always wears on screen.
           Copied from `--wordmark-grad` in globals.css, light-theme stops --
           deeper and more saturated so it stays legible on white. */
        --wordmark-grad: linear-gradient(
          112deg,
          #0e9c82 0%,
          #1b9ca0 22%,
          #b9862c 40%,
          #2c7cbe 62%,
          #18915f 83%,
          #2f9a50 100%
        );
      }
      /* The app's theme lives in a cookie this page cannot act on before first
         paint, so it follows the SYSTEM setting instead. Being one shade off
         the app's chosen theme is invisible next to a flash of white. */
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #0a0c0b;
          --fg: #f4f6f5;
          --muted: #9aa4a1;
          /* Brighter shell tones, so the iridescence reads against near-black. */
          --wordmark-grad: linear-gradient(
            112deg,
            #26ddb6 0%,
            #35d3cc 22%,
            #ecc766 40%,
            #57a8ee 62%,
            #40d98c 83%,
            #63dd76 100%
          );
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--ground);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      main { max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
      h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 15px; line-height: 1.55; color: var(--muted); }
      button {
        margin-top: 10px;
        min-height: 48px;
        border: 0;
        border-radius: 14px;
        background: var(--primary);
        color: var(--on-primary);
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
      }
      button:active { opacity: 0.85; }
      .mark { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: var(--fg); }
      /* "Mess" is the only coloured part of the wordmark, and on screen it is
         always the pear's sedef gradient -- never flat teal. Flat colour stays
         as the fallback for anything without background-clip. */
      .mark span { color: var(--brand, #17d1a8); }
      @supports ((-webkit-background-clip: text) or (background-clip: text)) {
        .mark span {
          background-image: var(--wordmark-grad);
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;
          color: transparent;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- The wordmark keeps its rule: "Mess" is the only coloured part. -->
      <p class="mark">Fit<span>Mess</span></p>
      <h1 id="naslov">Nema veze sa internetom</h1>
      <p id="objasnjenje">
        FitMess čuva tvoj dan na serveru, pa mu treba mreža da ga prikaže.
        Uključi Wi-Fi ili mobilne podatke pa probaj ponovo.
      </p>
      <button id="ponovo" type="button">Pokušaj ponovo</button>
    </main>

    <script>
      // Reload, never navigate: the service worker served this page in place of
      // the URL the user asked for, and the address bar still holds that URL --
      // so a reload retries THEIR screen. Sending them to a fixed route would
      // quietly lose where they were going.
      document.getElementById("ponovo").addEventListener("click", function () {
        location.reload();
      });

      // Come back on our own the moment the connection returns, so nobody sits
      // on this screen after the signal is back.
      window.addEventListener("online", function () {
        location.reload();
      });

      // The app is bilingual and its language lives in the `fm_locale` cookie,
      // which is same-origin and readable here. Serbian is the default and is
      // already in the markup, so only English needs swapping in.
      if (/(^|;\s*)fm_locale=en(;|$)/.test(document.cookie)) {
        document.documentElement.lang = "en";
        document.getElementById("naslov").textContent = "No internet connection";
        document.getElementById("objasnjenje").textContent =
          "FitMess keeps your day on the server, so it needs a connection to show it. Turn on Wi-Fi or mobile data and try again.";
        document.getElementById("ponovo").textContent = "Try again";
      }
    </script>
  </body>
</html>
