<meta charset="utf-8">
<title>FitMess · Scena 01 — junk → -5kg</title>
<style>
  /* ============================================================
     FitMess motion graphic — Scena 01
     Emoji (sistemski) + minimalizam. Canvas 1920x1080.
     Pozadina bela #FFFFFF (flag za zelenu #00FF00). Restart van canvasa.
     ============================================================ */

  :root {
    --accent: #17d1a8;
    --red:    #E63946;

    /* timeline (s) */
    --arrow-d:   1.70s;
    --arrow-dur: 0.85s;
    --head-d:    2.50s;
    /* payoff (shake + darken + badge) = 2.6s, inline u pravilima ispod */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%; background: #1c2024; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- kontrole van canvasa ---- */
  .bar {
    position: fixed; top: 0; left: 0; right: 0; height: 64px; z-index: 10;
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
    background: #14171b; color: #e7ecea; font-weight: 800; font-size: 15px;
  }
  .bar .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .bar .sub { color: #9aa6a1; font-weight: 600; }
  .bar .spacer { flex: 1; }
  .bar .hint { color: #9aa6a1; font-weight: 600; font-size: 13px; }
  .bar button {
    font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; border: none;
    border-radius: 10px; padding: 9px 18px; color: #04120e; background: var(--accent);
    transition: transform .08s ease, filter .15s ease;
  }
  .bar button.ghost { background: #2a2f36; color: #e7ecea; }
  .bar button:hover { filter: brightness(1.06); }
  .bar button:active { transform: translateY(1px) scale(.98); }

  .viewport { position: absolute; inset: 64px 0 0 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }

  /* ---- CANVAS 1920x1080 ---- */
  .stage { position: relative; width: 1920px; height: 1080px; background: #FFFFFF;
           transform-origin: center center; overflow: hidden; }
  .stage.green { background: #00FF00; }

  /* ---- emoji ikonice ---- */
  .slot { position: absolute; top: 410px; width: 220px; height: 220px; display: grid; place-items: center; }
  .rise { display: grid; place-items: center; }
  .pop  { transform: scale(0); will-change: transform; }
  .glyph {
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    font-size: 180px; line-height: 1; user-select: none;
    transform: rotate(var(--rot));
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.15));
    will-change: opacity;
  }

  .stage.run .pop {
    animation: pop 0.46s cubic-bezier(0.34, 1.56, 0.64, 1) var(--d) both,
               shake 0.42s ease-in-out 2.6s both;
  }
  .stage.run .rise { animation: floatY var(--fdur) ease-in-out var(--fd) infinite; }
  .stage.run .glyph { animation: darken 0.3s ease 2.6s forwards; }

  @keyframes pop   { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  @keyframes floatY{ 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes darken{ to { opacity: 0.55; } }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    16% { transform: translateX(-8px); }
    33% { transform: translateX(8px); }
    50% { transform: translateX(-8px); }
    66% { transform: translateX(8px); }
    83% { transform: translateX(-6px); }
  }

  /* ---- strelica ---- */
  .arrow { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
  .arrow .shaft {
    fill: none; stroke: var(--red); stroke-width: 36; stroke-linecap: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
  }
  .arrow .head {
    fill: var(--red); stroke-linejoin: round;
    transform-box: fill-box; transform-origin: center; opacity: 0; transform: scale(0);
  }
  .stage.run .arrow .shaft { animation: draw var(--arrow-dur) cubic-bezier(0.22, 0.61, 0.36, 1) var(--arrow-d) forwards; }
  .stage.run .arrow .head  { animation: headPop 0.26s cubic-bezier(0.34, 1.56, 0.64, 1) var(--head-d) both; }
  @keyframes draw    { to { stroke-dashoffset: 0; } }
  @keyframes headPop { 0% { opacity: 0; transform: scale(0); } 100% { opacity: 1; transform: scale(1); } }

  /* ---- badge "-5kg" ---- */
  .badge-pos { position: absolute; left: 1580px; top: 885px; transform: translate(-50%, -50%); }
  .badge {
    display: inline-block; background: var(--red); color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 900;
    font-size: 120px; line-height: 1; letter-spacing: -1px;
    padding: 26px 44px; border-radius: 24px;
    box-shadow: 0 16px 40px rgba(230,57,70,0.35);
    opacity: 0; transform: scale(0); transform-origin: center; will-change: transform;
  }
  .stage.run .badge { animation: badgePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 2.6s both; }
  @keyframes badgePop {
    0%   { opacity: 0; transform: scale(0); }
    60%  { opacity: 1; transform: scale(1.12); }
    80%  { transform: scale(0.96); }
    100% { opacity: 1; transform: scale(1); }
  }
</style>

<div class="bar">
  <span class="dot"></span> FitMess · Scena 01 <span class="sub">— junk → -5kg</span>
  <span class="spacer"></span>
  <span class="hint">snimaj na 100% zuma za oštar 1080p</span>
  <button id="bg" class="ghost">Pozadina: bela</button>
  <button id="play">▶ Restart</button>
</div>

<div class="viewport">
  <div class="stage" id="stage">

    <!-- emoji parada: 🍬 🍔 🍕 🍩 🥤 -->
    <div class="slot" style="left:250px; --d:0.00s; --rot:-6deg; --fd:0.52s; --fdur:2.0s">
      <div class="rise"><div class="pop"><div class="glyph">🍬</div></div></div>
    </div>
    <div class="slot" style="left:550px; --d:0.32s; --rot:5deg; --fd:0.84s; --fdur:2.3s">
      <div class="rise"><div class="pop"><div class="glyph">🍔</div></div></div>
    </div>
    <div class="slot" style="left:850px; --d:0.64s; --rot:-3deg; --fd:1.16s; --fdur:1.8s">
      <div class="rise"><div class="pop"><div class="glyph">🍕</div></div></div>
    </div>
    <div class="slot" style="left:1150px; --d:0.96s; --rot:6deg; --fd:1.48s; --fdur:2.4s">
      <div class="rise"><div class="pop"><div class="glyph">🍩</div></div></div>
    </div>
    <div class="slot" style="left:1450px; --d:1.28s; --rot:-4deg; --fd:1.80s; --fdur:2.1s">
      <div class="rise"><div class="pop"><div class="glyph">🥤</div></div></div>
    </div>

    <!-- strelica: blaga kriva, dijagonalno nadole -->
    <svg class="arrow" viewBox="0 0 1920 1080" preserveAspectRatio="none">
      <path class="shaft" pathLength="1" d="M320 320 Q940 600 1520 770"/>
      <path class="head" d="M1537 775 L1433 805 L1465 693 Z"/>
    </svg>

    <!-- badge -->
    <div class="badge-pos"><div class="badge">-5kg</div></div>

  </div>
</div>

<script>
  // FLAG: green-screen pozadina. true -> #00FF00 (chroma), false -> bela.
  const GREEN_FLAG = false;

  const stage = document.getElementById('stage');
  const playBtn = document.getElementById('play');
  const bgBtn = document.getElementById('bg');
  let GREEN = GREEN_FLAG;

  function fit() {
    const s = Math.min((window.innerWidth - 40) / 1920, (window.innerHeight - 120) / 1080);
    stage.style.transform = 'scale(' + Math.min(s, 1) + ')';
  }
  function play() {
    stage.classList.remove('run');
    void stage.offsetWidth;                 // reflow -> čist restart
    requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.add('run')));
  }
  function applyBg() { stage.classList.toggle('green', GREEN); bgBtn.textContent = 'Pozadina: ' + (GREEN ? 'zelena' : 'bela'); }

  playBtn.addEventListener('click', play);
  bgBtn.addEventListener('click', () => { GREEN = !GREEN; applyBg(); });
  window.addEventListener('resize', fit);

  applyBg(); fit();
  requestAnimationFrame(play);
</script>
