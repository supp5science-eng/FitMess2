<meta charset="utf-8">
<title>FitMess · Junk → -5kg</title>
<style>
  /* ============================================================
     FitMess motion graphic — Scena 01: junk hrana → -5kg
     Canvas 1920x1080 (16:9). Overlay clip za montažu preko snimka.
     Pozadina: bela #FFFFFF (default) ili green-screen #00FF00 (flag).
     ============================================================ */

  :root {
    /* --- timeline (sekunde) --- */
    --pop-dur: 0.55s;         /* trajanje "iskakanja" jedne ikonice */
    --gap:     0.32s;         /* razmak između ikonica              */
    --arrow-d:  1.80s;        /* start crtanja strelice             */
    --arrow-dur:0.85s;        /* trajanje crtanja strelice          */
    --tag-d:    2.55s;        /* pop "-5kg"                         */
    --shake-d:  2.60s;        /* trešnja ikonica (reakcija)         */

    --ink:  #14181a;          /* tamna kontura / tekst              */
    --red:  #E63946;          /* strelica                           */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #20242a;
    font-family: Inter, "Helvetica Neue", Arial, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* --- kontrole VAN canvasa (za restart snimanja) --- */
  .bar {
    position: fixed; top: 0; left: 0; right: 0; height: 68px; z-index: 10;
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
    background: #171a1f; color: #e7ecea;
    font-weight: 800; font-size: 15px; letter-spacing: .2px;
  }
  .bar .dot { color: #17d1a8; }
  .bar button {
    font: inherit; font-weight: 800; cursor: pointer;
    border: none; border-radius: 10px; padding: 10px 20px; color: #04120e;
    background: #17d1a8; transition: transform .08s ease, filter .15s ease;
  }
  .bar button:hover { filter: brightness(1.08); }
  .bar button:active { transform: translateY(1px) scale(.98); }
  .bar button.ghost { background: #2a2f36; color: #e7ecea; }
  .bar .spacer { flex: 1; }
  .bar .hint { font-weight: 600; opacity: .55; font-size: 13px; }

  /* --- viewport koji skalira canvas da stane na ekran --- */
  .viewport {
    position: absolute; inset: 68px 0 0 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  /* --- SAM CANVAS: tačno 1920x1080 --- */
  .stage {
    position: relative;
    width: 1920px; height: 1080px;
    background: #FFFFFF;
    transform-origin: center center;
    overflow: hidden;
  }
  .stage.green { background: #00FF00; }

  /* --- ikonice --- */
  .icon-wrap { position: absolute; width: 220px; height: 220px; top: 430px; }
  .icon {
    width: 100%; height: 100%;
    opacity: 0;
    transform: scale(0) rotate(var(--rot));
    transform-origin: center center;
    will-change: transform, opacity;
  }
  .icon svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* iskakanje + kasnija trešnja (dve animacije na istom elementu) */
  .stage.run .icon {
    animation:
      pop var(--pop-dur) cubic-bezier(.2,.85,.25,1) var(--d) both,
      shake 0.55s ease-in-out var(--shake-d) 1;
  }

  @keyframes pop {
    0%   { opacity: 0; transform: scale(0)    rotate(var(--rot)); }
    55%  { opacity: 1; transform: scale(1.18) rotate(var(--rot)); }
    72%  {             transform: scale(0.9)  rotate(var(--rot)); }
    86%  {             transform: scale(1.06) rotate(var(--rot)); }
    100% { opacity: 1; transform: scale(1)    rotate(var(--rot)); }
  }

  @keyframes shake {
    0%, 100% { transform: scale(1)    rotate(var(--rot)); }
    15% { transform: scale(1.05) rotate(calc(var(--rot) - 8deg)) translateY(-5px); }
    35% { transform: scale(1.05) rotate(calc(var(--rot) + 8deg)) translateY(3px); }
    55% { transform: scale(1.03) rotate(calc(var(--rot) - 5deg)); }
    75% { transform: scale(1.02) rotate(calc(var(--rot) + 4deg)); }
  }

  /* --- strelica (crta se stroke-dashoffset animacijom) --- */
  .arrow { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
  .arrow-path {
    fill: none; stroke: var(--red); stroke-width: 40;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
    will-change: stroke-dashoffset;
  }
  .stage.run .arrow-path {
    animation: draw var(--arrow-dur) cubic-bezier(.65,0,.35,1) var(--arrow-d) forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* --- "-5kg" oznaka --- */
  .tag-pos {
    position: absolute; left: 1250px; top: 820px; width: 560px;
    text-align: center;
  }
  .tag {
    display: inline-block;
    font-weight: 900; letter-spacing: -4px; line-height: .9;
    color: var(--ink);
    -webkit-text-stroke: 3px #FFFFFF;
    paint-order: stroke fill;
    text-shadow: 0 6px 0 rgba(0,0,0,.10);
    opacity: 0;
    transform: scale(0) rotate(-6deg);
    transform-origin: center center;
    will-change: transform, opacity;
  }
  .tag .big  { font-size: 210px; }
  .tag .unit { font-size: 130px; }
  .stage.run .tag {
    animation: popTag 0.5s cubic-bezier(.2,.85,.25,1) var(--tag-d) both;
  }
  @keyframes popTag {
    0%   { opacity: 0; transform: scale(0)    rotate(-6deg); }
    60%  { opacity: 1; transform: scale(1.28) rotate(-6deg); }
    80%  {             transform: scale(0.9)  rotate(-6deg); }
    100% { opacity: 1; transform: scale(1)    rotate(-6deg); }
  }
</style>

<script>
  // ====== FLAG: green-screen pozadina ======
  // true  -> #00FF00 (za chroma key)
  // false -> #FFFFFF (bela)
  let GREEN = false;

  const stage   = document.getElementById('stage');
  const playBtn = document.getElementById('play');
  const bgBtn   = document.getElementById('bg');

  function applyBg() {
    stage.classList.toggle('green', GREEN);
    bgBtn.textContent = 'Pozadina: ' + (GREEN ? 'zelena' : 'bela');
  }

  // Restart animacije: skini klasu, forsiraj reflow, vrati klasu.
  // (requestAnimationFrame osigurava da browser stvarno "resetuje" stanje
  //  pre ponovnog pokretanja — čist restart za svako snimanje.)
  function play() {
    stage.classList.remove('run');
    void stage.offsetWidth;                 // reflow
    requestAnimationFrame(() => {
      requestAnimationFrame(() => stage.classList.add('run'));
    });
  }

  // Skaliraj canvas da uvek stane na ekran (samo za pregled;
  // snimaj na 100% zuma za oštar 1920x1080).
  function fit() {
    const s = Math.min(
      (window.innerWidth  - 40)  / 1920,
      (window.innerHeight - 108) / 1080
    );
    stage.style.transform = 'scale(' + Math.min(s, 1) + ')';
  }

  playBtn.addEventListener('click', play);
  bgBtn.addEventListener('click', () => { GREEN = !GREEN; applyBg(); });
  window.addEventListener('resize', fit);

  applyBg();
  fit();
  // Auto-play jednom po učitavanju.
  requestAnimationFrame(play);
</script>
